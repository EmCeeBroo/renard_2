<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/jpeg" href="../public/assets/img/renard.png.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../public/assets/css/style.css" />
  <title>Panel de Menús - Administrador</title>
</head>

<body>
  <!-- Sidebar -->
  <div id="sidebar-container"></div>

  <!-- Main Content -->
  <div class="admin-content">
    <div class="admin-header">
      <h2><i class="bi bi-menu-button-wide"></i> Panel de Menús</h2>
    </div>

    <div class="admin-card fade-in">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h5 class="mb-0">Listado de Menús</h5>
        <button class="btn btn-primary-custom" id="btnAgregar" data-bs-toggle="modal" data-bs-target="#createMenuModal">
          <i class="fas fa-plus me-2"></i> Agregar Menú
        </button>
      </div>

      <div class="mb-3">
        <input type="text" id="buscarInput" class="form-control" placeholder="Buscar menús..." />
      </div>

      <div class="table-responsive" >
        <table class="table table-bordered table-striped table-hover align-middle text-center" id="menuTable" aria-label="table count by menus">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Descripción</th>
              <th>Restaurante</th>
              <th>Creado</th>
              <th>Actualizado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="menuTableBody">
            <!-- Contenido generado dinámicamente -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal para crear menú -->
  <div class="modal fade" id="createMenuModal" tabindex="-1" aria-labelledby="createMenuModalLabel">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="createMenuForm">
          <div class="modal-header">
            <h5 class="modal-title" id="modalMenuTitulo">Agregar Menú</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label for="createNombre" class="form-label">Nombre del Menú</label>
              <input type="text" class="form-control" id="createNombre" required placeholder="Ej: Menú Ejecutivo, Menú Infantil, Menú del Día">
              <div class="invalid-feedback">Por favor ingrese el nombre del menú.</div>
            </div>
            <div class="mb-3">
              <label for="createDescripcion" class="form-label">Descripción</label>
              <textarea class="form-control" id="createDescripcion" rows="3" placeholder="Descripción opcional del menú"></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" id="btnCancelar" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary-custom">
              <i class="fas fa-plus-circle me-2"></i> Crear Menú
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal para editar menú -->
  <div class="modal fade" id="editMenuModal" tabindex="-1" aria-labelledby="editMenuModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="editMenuForm">
          <div class="modal-header">
            <h5 class="modal-title" id="editMenuModalLabel">Editar Menú</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="editMenuId" />
            <div class="mb-3">
              <label for="editNombre" class="form-label">Nombre del Menú</label>
              <input type="text" class="form-control" id="editNombre" required placeholder="Ej: Menú Ejecutivo, Menú Infantil, Menú del Día">
              <div class="invalid-feedback">Por favor ingrese el nombre del menú.</div>
            </div>
            <div class="mb-3">
              <label for="editDescripcion" class="form-label">Descripción</label>
              <textarea class="form-control" id="editDescripcion" rows="3" placeholder="Descripción opcional del menú"></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary-custom">
              <i class="fas fa-save me-2"></i> Guardar Cambios
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script type="module" src="../ViewsRenard/js/menuadmin.js"></script>
  <script src="../ViewsRenard/js/sidebar-dinamico.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderDynamicSidebar('sidebar-container');
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
