<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/jpeg" href="../public/assets/img/renard.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../public/assets/css/style.css" />
  <title>Panel de Mesas - Administrador Restaurante</title>
</head>

<body>
  <!-- Sidebar -->
  <div id="sidebar-container"></div>

  <!-- Main Content -->
  <div class="admin-content">
    <div class="admin-header">
      <h2><i class="bi bi-table"></i> Panel de Mesas</h2>
    </div>

    <div class="admin-card fade-in">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h5 class="mb-0">Listado de Mesas</h5>
        <button class="btn btn-primary-custom" data-bs-toggle="modal" data-bs-target="#createMesaModal">
          <i class="fas fa-plus me-2"></i> Agregar mesa
        </button>
      </div>

      <div class="table-responsive">
          <table class="table table-bordered table-striped table-hover align-middle text-center" id="mesaTable" aria-label="dynamic table of desks">
            <thead class="table-dark">
              <tr>
                <th>ID</th>
                <th>Número Mesa</th>
                <th>Sucursal</th>
                <th>Zona</th>
                <th>Estado</th>
                <th>Creado En</th>
                <th>Actualizado En</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="mesaTableBody">
              <!-- Contenido generado dinámicamente -->
            </tbody>
          </table>
      </div>
    </div>
  </div>

  <!-- Modal para editar mesa -->
  <div class="modal fade" id="editMesaModal" tabindex="-1" aria-labelledby="editMesaModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content align-items">
        <form id="editMesaForm">
          <div class="modal-header">
            <h5 class="modal-title" id="editMesaModalLabel">Editar Mesa</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="editMesaId" />
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Número de Mesa</label>
                <input type="number" class="form-control" id="editNumeroMesa" required min="1">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Sucursal</label>
                <select class="form-control" id="editSucursal" required>
                  <option value="">Seleccione una sucursal</option>
                </select>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Zona</label>
                <select class="form-control" id="editZona" required>
                  <option value="">Seleccione una zona</option>
                </select>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Estado Mesa</label>
                <select class="form-control" id="editEstadoMesa" required>
                  <option value="">Seleccione un estado</option>
                </select>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-primary-custom">
              <i class="fas fa-save me-2"></i> Guardar
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal para crear mesa -->
  <div class="modal fade" id="createMesaModal" tabindex="-1" aria-labelledby="createMesaModalLabel">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <form id="createMesaForm">
          <div class="modal-header">
            <h5 class="modal-title" id="createMesaModalLabel">Crear Mesa</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="createNumeroMesa" class="form-label">Número de Mesa</label>
                <input type="number" class="form-control" id="createNumeroMesa" required min="1">
              </div>
              <div class="col-md-6 mb-3">
                <label for="createSucursal" class="form-label">Sucursal</label>
                <select class="form-control" id="createSucursal" required>
                  <option value="">Seleccione una sucursal</option>
                </select>
              </div>
              <div class="col-md-6 mb-3">
                <label for="createZona" class="form-label">Zona</label>
                <select class="form-control" id="createZona" required>
                  <option value="">Seleccione una zona</option>
                </select>
              </div>
              <div class="col-md-6 mb-3">
                <label for="createEstadoMesa" class="form-label">Estado Mesa</label>
                <select class="form-control" id="createEstadoMesa" required>
                  <option value="">Seleccione un estado</option>
                </select>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-primary-custom">
              <i class="fas fa-plus-circle me-2"></i> Crear Mesa
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal para ver detalles de mesa -->
  <div class="modal fade" id="viewMesaModal" tabindex="-1" aria-labelledby="viewMesaModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="viewMesaModalLabel">Detalles de Mesa</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <p><strong>ID Mesa:</strong> <span id="viewMesaId"></span></p>
          <p><strong>Número Mesa:</strong> <span id="viewNumeroMesa"></span></p>
          <p><strong>Sucursal:</strong> <span id="viewSucursal"></span></p>
          <p><strong>Zona:</strong> <span id="viewZona"></span></p>
          <p><strong>Estado:</strong> <span id="viewEstadoMesa"></span></p>
          <p><strong>Creado En:</strong> <span id="viewCreatedAt"></span></p>
          <p><strong>Actualizado En:</strong> <span id="viewUpdatedAt"></span></p>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="../ViewsRenard/mesadmin/js/mesadmin.js"></script>
  <script src="../narvaradminrestaurante/dashboardrestaurante.js" defer></script>
  <script src="../ViewsRenard/js/sidebar-dinamico.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderSidebar('sidebar-container');
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
