<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/jpeg" href="../public/assets/img/renard.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../public/assets/css/style.css" />
  <title>Panel de Productos - Administrador</title>
</head>

<body>
  <!-- Sidebar -->
  <div id="sidebar-container"></div>

  <!-- Main Content -->
  <div class="admin-content">
    <div class="admin-header">
      <h2><i class="bi bi-basket"></i> Panel de Productos</h2>
    </div>

    <div class="admin-card fade-in">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h5 class="mb-0">Listado de Productos</h5>
        <button class="btn btn-primary-custom" data-bs-toggle="modal" data-bs-target="#createProductoModal">
          <i class="fas fa-plus me-2"></i> Agregar Producto
        </button>
      </div>

      <div class="table-responsive">
        <table class="table table-bordered table-striped table-hover align-middle text-center" id="productoTable" aria-label="dynamic table of products" >
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Precio</th>
              <th>Descripción</th>
              <th>Menú</th>
              <th>Categoría</th>
              <th>Imagen</th>
              <th>Creado</th>
              <th>Actualizado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="productoTableBody">
            <!-- Contenido generado dinámicamente -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal para crear producto -->
  <div class="modal fade" id="createProductoModal" tabindex="-1" aria-labelledby="createProductoModalLabel">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <form id="createProductoForm" enctype="multipart/form-data">
          <div class="modal-header">
            <h5 class="modal-title" id="createProductoModalLabel">Crear Producto</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body row">
            <div class="col-md-6 mb-3">
              <label for="createNombre" class="form-label">Nombre</label>
              <input type="text" class="form-control" id="createNombre" required>
            </div>
            <div class="col-md-6 mb-3">
              <label for="createPrecio" class="form-label">Precio</label>
              <input type="number" class="form-control" id="createPrecio" required>
            </div>
            <div class="col-md-12 mb-3">
              <label for="createDescripcion" class="form-label">Descripción</label>
              <textarea class="form-control" id="createDescripcion" required></textarea>
            </div>
            <div class="col-md-6 mb-3">
              <label for="createMenu" class="form-label">Menú</label>
              <select class="form-control" id="createMenu" required>
                <option value="">Seleccione un menú</option>
              </select>
            </div>
            <div class="col-md-6 mb-3">
              <label for="createCategoria" class="form-label">Categoría</label>
              <select class="form-control" id="createCategoria" required>
                <option value="">Seleccione una categoría</option>
              </select>
            </div>
            <div class="col-md-6 mb-3">
              <label for="createImagen" class="form-label">Imagen</label>
              <input type="file" class="form-control" id="createImagen" accept="image/*">
            </div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-primary-custom">
              <i class="fas fa-plus-circle me-2"></i> Crear Producto
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal para editar producto - CORREGIDO: Cambiado id a editProductoModal -->
  <div class="modal fade" id="editProductoModal" tabindex="-1" aria-labelledby="editProductoModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <form id="editProductoForm" enctype="multipart/form-data">
          <div class="modal-header">
            <h5 class="modal-title" id="editProductoModalLabel">Editar Producto</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body row">
            <input type="hidden" id="editProductoId" />
            <div class="col-md-6 mb-3">
              <label class="form-label">Nombre</label>
              <input type="text" class="form-control" id="editNombre" required>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Precio</label>
              <input type="number" class="form-control" id="editPrecio" required>
            </div>
            <div class="col-md-12 mb-3">
              <label class="form-label">Descripción</label>
              <textarea class="form-control" id="editDescripcion" required></textarea>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Menú</label>
              <select class="form-control" id="editMenu" required>
                <option value="">Seleccione un menú</option>
              </select>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Categoría</label>
              <select class="form-control" id="editCategoria" required>
                <option value="">Seleccione un tipo</option>
              </select>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Imagen</label>
              <input type="file" class="form-control" id="editImagen" accept="image/*">
            </div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-primary-custom">
              <i class="fas fa-save me-2"></i> Guardar
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal para ver detalles de producto -->
  <div class="modal fade" id="viewProductoModal" tabindex="-1" aria-labelledby="viewProductoModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="viewProductoModalLabel">Detalles de Producto</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <p><strong>ID Producto:</strong> <span id="viewProductoId"></span></p>
          <p><strong>Nombre:</strong> <span id="viewNombre"></span></p>
          <p><strong>Precio:</strong> <span id="viewPrecio"></span></p>
          <p><strong>Descripción:</strong> <span id="viewDescripcion"></span></p>
          <p><strong>Menu:</strong> <span id="viewMenu"></span></p>
          <p><strong>Categoría:</strong> <span id="viewCategoria"></span></p>
          <p><strong>Imagen:</strong> <img id="viewImagen" src="" alt="Imagen" style="max-width: 100px;"></p>
          <p><strong>Creado En:</strong> <span id="viewCreatedAt"></span></p>
          <p><strong>Actualizado En:</strong> <span id="viewUpdatedAt"></span></p>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="../ViewsRenard/js/productoadmin.js"></script>
  <script src="../ViewsRenard/js/sidebar-dinamico.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof renderDynamicSidebar === 'function') {
        renderDynamicSidebar('sidebar-container');
      }
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
