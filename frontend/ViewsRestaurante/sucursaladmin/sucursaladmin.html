<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/jpeg" href="../public/assets/img/renard.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../public/assets/css/style.css" />
  <title>Panel de Sucursales - Administrador</title>
</head>

<body>
  <!-- Sidebar -->
  <div id="sidebar-container"></div>

  <!-- Main Content -->
  <div class="admin-content">
    <div class="admin-header">
      <h2><i class="bi bi-geo-alt"></i> Panel de Sucursales</h2>
    </div>

    <div class="admin-card fade-in">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h5 class="mb-0">Listado de Sucursales</h5>
        <button class="btn btn-primary-custom" data-bs-toggle="modal" data-bs-target="#createSucursalModal">
          <i class="fas fa-plus me-2"></i> Agregar Sucursal
        </button>
      </div>

      <div class="table-responsive">
        <table class="table table-bordered table-striped table-hover align-middle text-center" id="sucursalTable"  aria-label="pivot table of branches">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Dirección</th>
              <th>Horario Apertura</th>
              <th>Horario Cierre</th>
              <th>Creado En</th>
              <th>Actualizado En</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="sucursalTableBody">
            <!-- Contenido generado dinámicamente -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal para editar sucursal -->
  <div class="modal fade" id="editSucursalModal" tabindex="-1" aria-labelledby="editSucursalModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <form id="editSucursalForm">
          <div class="modal-header">
            <h5 class="modal-title" id="editSucursalModalLabel">Editar Sucursal</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body row">
            <input type="hidden" id="editSucursalId" />
            <div class="col-md-6 mb-3">
              <label class="form-label">Nombre</label>
              <input type="text" class="form-control" id="editNombre" required />
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Dirección</label>
              <input type="text" class="form-control" id="editDireccion" required />
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Horario Apertura</label>
              <input type="time" class="form-control" id="editHorarioApertura" required />
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Horario Cierre</label>
              <input type="time" class="form-control" id="editHorarioCierre" required />
            </div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-primary-custom">
              <i class="fas fa-save me-2"></i> Guardar
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal para crear sucursal -->
  <div class="modal fade" id="createSucursalModal" tabindex="-1" aria-labelledby="createSucursalModalLabel">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <form id="createSucursalForm">
          <div class="modal-header">
            <h5 class="modal-title" id="createSucursalModalLabel">Crear Sucursal</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body row">
            <div class="col-md-6 mb-3">
              <label for="createNombre" class="form-label">Nombre</label>
              <input type="text" class="form-control" id="createNombre" required />
            </div>
            <div class="col-md-6 mb-3">
              <label for="createDireccion" class="form-label">Dirección</label>
              <input type="text" class="form-control" id="createDireccion" required />
            </div>
            <div class="col-md-6 mb-3">
              <label for="createHorarioApertura" class="form-label">Horario Apertura</label>
              <input type="time" class="form-control" id="createHorarioApertura" required />
            </div>
            <div class="col-md-6 mb-3">
              <label for="createHorarioCierre" class="form-label">Horario Cierre</label>
              <input type="time" class="form-control" id="createHorarioCierre" required />
            </div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-primary-custom">
              <i class="fas fa-plus-circle me-2"></i> Crear Sucursal
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal para ver detalles de sucursal -->
  <div class="modal fade" id="viewSucursalModal" tabindex="-1" aria-labelledby="viewSucursalModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="viewSucursalModalLabel">Detalles de Sucursal</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <p><strong>ID Sucursal:</strong> <span id="viewSucursalId"></span></p>
          <p><strong>Nombre:</strong> <span id="viewNombre"></span></p>
          <p><strong>Dirección:</strong> <span id="viewDireccion"></span></p>
          <p><strong>Horario Apertura:</strong> <span id="viewHorarioApertura"></span></p>
          <p><strong>Horario Cierre:</strong> <span id="viewHorarioCierre"></span></p>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="../ViewsRenard/js/sucursaladmin.js"></script>
  <script src="../ViewsRenard/js/sidebar-dinamico.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderDynamicSidebar('sidebar-container');
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
