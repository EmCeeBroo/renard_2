<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/jpeg" href="../public/assets/img/renard.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../public/assets/css/dashboard.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
  <title>Dashboard Restaurante - Panel de Administración</title>
</head>

<body>
  <!-- Sidebar Container for Dynamic Sidebar -->
  <div id="sidebar-container"></div>

  <!-- Main Content -->
  <div class="admin-content">
    <div class="admin-header">
      <img src="Gemini_Generated_Image_gbpmhngbpmhngbpm.png" alt="Logo" style="height: 90px; margin-right: 15px;">
      <h2><i class="bi bi-speedometer2"></i> Dashboard Restaurante</h2>
      <h3>Bienvenido administrador restaurante</h3>
    </div>

    <!-- Icon grid organized by categories -->
    <div class="icon-grid-container">
      <div class="category-group">
        <h3 class="section-title"><i class="bi bi-shop"></i> Gestión Restaurante</h3>
        <div class="icon-grid">
          <a href="../restaurante/restaurante.html" class="icon-card" title="Restaurantes" style="background-color: #FF5A00;">
            <i class="bi bi-shop"></i>
            <span>Restaurantes</span>
          </a>
          <a href="../menu/menu.html" class="icon-card" title="Menús" style="background-color: #FF8C38;">
            <i class="bi bi-menu-button-wide"></i>
            <span>Menús</span>
          </a>
          <a href="../producto/producto.html" class="icon-card" title="Producto" style="background-color: #06D6A0;">
            <i class="bi bi-basket"></i>
            <span>Productos</span>
          </a>
          <a href="../categoriaMenu/categoriaMenu.html" class="icon-card" title="Categorías" style="background-color: #1B9AAA;">
            <i class="bi bi-list-ul"></i>
            <span>Categorías</span>
          </a>
        </div>
      </div>
      
      <div class="category-group">
        <h3 class="section-title"><i class="bi bi-calendar-check"></i> Reservas y Mesas</h3>
        <div class="icon-grid">
          <a href="../reservas/reservas.html" class="icon-card" title="Reservas" style="background-color: #FFD166;">
            <i class="bi bi-calendar-check"></i>
            <span>Reservas</span>
          </a>
          <a href="../zona/zona.html" class="icon-card" title="Zonas" style="background-color: #F4A261;">
            <i class="bi bi-pin-map"></i>
            <span>Zonas</span>
          </a>
          <a href="../ubicacionPanel/ubicacionPanel.html" class="icon-card" title="Ubicaciones" style="background-color: #118AB2;">
            <i class="bi bi-geo-alt"></i>
            <span>Ubicaciones</span>
          </a>
        </div>
      </div>
      
      <div class="category-group">
        <h3 class="section-title"><i class="bi bi-gear"></i> Configuración</h3>
        <div class="icon-grid">
          <a href="../views/qrMenu/qrMenu.html" class="icon-card" title="QR Menú" style="background-color: #EF476F;">
            <i class="bi bi-qr-code"></i>
            <span>QR Menú</span>
          </a>
          <a href="../views/login/login.html" class="icon-card" title="Cerrar Sesión" style="background-color: #4A4E69;">
            <i class="bi bi-box-arrow-right"></i>
            <span>Cerrar Sesión</span>
          </a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/sidebar-dinamico.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Initialize dynamic sidebar
      initDynamicSidebar();
    });
  </script>
</body>
</html>
