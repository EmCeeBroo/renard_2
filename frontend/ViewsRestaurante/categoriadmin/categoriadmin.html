<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/jpeg" href="../public/assets/img/renard.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../public/assets/css/style.css" />
  <title>Panel de Categorías - Administrador</title>
</head>

<body>
  <!-- Sidebar -->
  <div id="sidebar-container"></div>

  <!-- Main Content -->
  <div class="admin-content">
    <div class="admin-header">
      <h2><i class="bi bi-tags"></i> Panel de Categorías</h2>
    </div>

    <div class="admin-card fade-in">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h5 class="mb-0">Listado de Categorías</h5>
        <button class="btn btn-primary-custom" id="btnAgregar" data-bs-toggle="modal" data-bs-target="#createCategoriaModal">
          <i class="fas fa-plus me-2"></i> Agregar Categoría
        </button>
      </div>

      <div class="mb-3">
        <input type="text" id="buscarInput" class="form-control" placeholder="Buscar categorías...">
      </div>

      <div class="table-responsive">
        <table class="table table-bordered table-striped table-hover align-middle text-center" id="categoriaTable" aria-label="table count by categories ">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Restaurante</th>
              <th>Creado</th>
              <th>Actualizado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="categoriaTableBody">
            <!-- Contenido generado dinámicamente -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal para crear categoría -->
  <div class="modal fade" id="createCategoriaModal" tabindex="-1" aria-labelledby="createCategoriaModalLabel">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="createCategoriaForm">
          <div class="modal-header">
            <h5 class="modal-title" id="modalCategoriaTitulo">Agregar Categoría</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label for="createNombre" class="form-label">Nombre de la Categoría</label>
              <input type="text" class="form-control" id="createNombre" required placeholder="Ej: Entradas, Platos principales, Postres">
              <div class="invalid-feedback">Por favor ingrese el nombre de la categoría.</div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" id="btnCancelar" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary-custom">
              <i class="fas fa-plus-circle me-2"></i> Crear Categoría
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal para editar categoría -->
  <div class="modal fade" id="editCategoriaModal" tabindex="-1" aria-labelledby="editCategoriaModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="editCategoriaForm">
          <div class="modal-header">
            <h5 class="modal-title" id="editCategoriaModalLabel">Editar Categoría</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="editCategoriaIdEdit" />
            <div class="mb-3">
              <label for="editNombre" class="form-label">Nombre de la Categoría</label>
              <input type="text" class="form-control" id="editNombre" required placeholder="Ej: Entradas, Platos principales, Postres">
              <div class="invalid-feedback">Por favor ingrese el nombre de la categoría.</div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary-custom">
              <i class="fas fa-save me-2"></i> Guardar Cambios
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script type="module" src="../ViewsRestaurante/js/categoriadmin.js"></script>
  <script src="../VIewRestaurante/js/sidebar-dinamico.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderDynamicSidebar('sidebar-container');
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
