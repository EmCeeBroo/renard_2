<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/jpeg" href="../public/assets/img/renard.png.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <title>Panel de Estado de Mesa - Administrador</title>
  <link rel="stylesheet" href="../public/assets/css/style.css" />
  <script src="../sidebar/sidebar.js" defer></script>
</head>

<body>
  <!--Preload-->
  <div class="preload" id="preloadId">
    <div class="preload-spinner"></div>
    <h3 class="mt-3">Cargando...</h3>
  </div>
  <!--End Preload-->

  <!-- Sidebar -->
  <div id="sidebar-container"></div>

  <!-- Main Content -->
  <div class="admin-content">
    <div class="admin-header">
      <h2><i class="bi bi-table"></i> Estado de Mesa </h2>
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="/admin/dashboard">Inicio</a></li>
          <li class="breadcrumb-item active" aria-current="page">Estados de mesa</li>
        </ol>
      </nav>
    </div>

    <div class="admin-card fade-in">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h5 class="mb-0">Listado de estados de mesa</h5>
        <button class="btn btn-primary-custom" id="btnAgregar" type="button" data-bs-toggle="modal" data-bs-target="#modalEstadoMesa">
          <i class="fas fa-plus me-2"></i> Agregar estado de mesa
        </button>
      </div>

      <div class="row mb-3">
        <!-- Búsqueda por texto -->
        <div class="col-md-6">
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="text" class="form-control" id="buscarEstadoMesa"
              placeholder="Buscar estado de mesa...">
          </div>
        </div>

        <!-- Filtro por estado -->
        <div class="col-md-6">
          <select class="form-select" id="filtroEstadoMesa">
            <option value="">Todos los estados</option>
            <!-- aquí se llenan dinámicamente -->
          </select>
        </div>
      </div>
      

      <div class="table-responsive">
        <table class="table table-bordered table-striped table-hover align-middle text-center" id="tablaEstadoMesas" aria-label="dynamic table of table status">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Descripción</th>
              <th>Creado</th>
              <th>Actualizado</th>
              <th>Editar</th>
              <th>Eliminar</th>
            </tr>
          </thead>
          <tbody id="tablaEstadoMesasBody">
            <!-- Contenido generado dinámicamente -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal para crear/editar estado de mesa -->
  <div class="modal fade" id="modalEstadoMesa" tabindex="-1" aria-labelledby="modalEstadoMesaTitulo" aria-hidden="true">
    <div class="modal-dialog">
      <form id="formEstadoMesa" class="modal-content needs-validation" novalidate>
        <div class="modal-header">
          <h5 class="modal-title" id="modalEstadoMesaTitulo">Agregar estado de mesa</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="id_estado_mesa" />
          <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="nombre" required />
            <div class="invalid-feedback">Por favor ingrese el nombre.</div>
          </div>
          <div class="mb-3">
            <label for="descripcion" class="form-label">Descripción</label>
            <textarea class="form-control" id="descripcion" rows="3"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" id="btnGuardar" class="btn btn-primary-custom">Guardar</button>
          <button type="button" class="btn btn-secondary" id="btnCancelar" data-bs-dismiss="modal">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Loading overlay -->
  <div id="loadingOverlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.7); z-index:1050; align-items:center; justify-content:center;">
    <div class="spinner-border text-primary">
      <span class="visually-hidden">Cargando...</span>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="module" src="../public/assets/js/estadoMesaPanel.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderSidebar('sidebar-container');
    });
  </script>
  <script>
    // Ocultar preload
    setTimeout(function() {
      document.getElementById('preloadId').style.opacity = '0';
      document.getElementById('preloadId').style.visibility = 'hidden';
    }, 500);
  </script>
</body>
</html>
