 <!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/jpeg" href="../public/assets/img/renard.png.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <title>Panel de TipoDocumento - Administrador</title>
  <link rel="stylesheet" href="../public/assets/css/style.css">
  <script src="../sidebar/sidebar.js" defer></script>
</head>


<body>
  <!--Preload-->
  <div class="preload" id="preloadId">
    <div class="preload-spinner"></div>
    <h3 class="mt-3">Cargando...</h3>
  </div>
  <!--End Preload-->


  <!-- Sidebar -->
  <div id="sidebar-container"></div>

  <!-- Main Content -->
  <div class="admin-content">
    <div class="admin-header">
      <h2><i class="bi bi-pin-map"></i> Gestión de TipoDocumento</h2>
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="/admin/dashboard">Inicio</a></li>
          <li class="breadcrumb-item active" aria-current="page">TipoDocumento</li>
        </ol>
      </nav>
    </div>


      <div class="admin-card fade-in">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h5 class="mb-0">Listado de TipoDocumento</h5>
          <button class="btn btn-primary-custom" id="btnAgregar">
            <i class="fas fa-plus me-2"></i> Agregar TipoDocumento
          </button>
        </div>

      <!-- Filtros y búsqueda -->
      <div class="row mb-3">
        <div class="col-md-6">
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="text" class="form-control" id="buscarInput" placeholder="Buscar por nombre">
          </div>
        </div>
      </div>


      <div class="table-responsive">
        <table class="table table-bordered table-striped table-hover align-middle text-center" id="tablaTipoDocumento" aria-label="Dynamic Table of Document Type">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Descripcion</th>
              <th>Creado en </th>
              <th>Actualizado en</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <!-- Contenido generado dinámicamente -->
          </tbody>
        </table>
    <!-- Modal para editar TipoDocumento -->
    <div class="modal fade" id="modalTipoDocumento" tabindex="-1" aria-labelledby="modalTitulo" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="formTipoDocumento" class="needs-validation" novalidate>
            <div class="modal-header">
              <h5 class="modal-title" id="modalTitulo">Agregar TipoDocumento</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
              <input type="hidden" id="id_TipoDocumento" />
              <div class="mb-3">
                <label for="nombre" class="form-label">Nombre:</label>
                <input type="text" class="form-control" id="nombre" name="nombre" required />
                <div class="invalid-feedback">Por favor ingrese un nombre.</div>
              </div>
              <div class="mb-3">
                <label for="descripcion" class="form-label">Descripcion:</label>
                <input type="text" class="form-control" id="descripcion" name="descripcion" required />
                <div class="invalid-feedback">Por favor ingrese una descripcion.</div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="submit" id="btnGuardar" class="btn btn-success">Guardar</button>
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" id="btnCancelar">Cancelar</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>


  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="module" src="../public/assets/js/TipoDocumentoPanel.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderSidebar('sidebar-container');
    });
  </script>
  <script>
    // Ocultar preload
    setTimeout(function() {
      document.getElementById('preloadId').style.opacity = '0';
      document.getElementById('preloadId').style.visibility = 'hidden';
    }, 500);
  </script>
</body>
</html>
