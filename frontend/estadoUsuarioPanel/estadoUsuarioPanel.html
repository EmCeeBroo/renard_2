<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panel de Estados de Usuario - Renard</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <!-- Custom CSS -->
  <link rel="stylesheet" href="../public/assets/css/usuarioPanel.css" />
  <script src="../sidebar/sidebar.js" defer></script>
</head>

<body>
  <!--Preload-->
  <div class="preload" id="preloadId">
    <div class="preload-spinner"></div>
    <h3 class="mt-3">Cargando...</h3>
  </div>
  <!--End Preload-->

  <!-- Sidebar -->
  <div id="sidebar-container"></div>

  <!-- Main Content -->
  <div class="admin-content">
    <div class="admin-header">
      <h2><i class="bi bi-person-badge"></i> Panel de Estados de Usuario</h2>
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="/admin/dashboard">Inicio</a></li>
          <li class="breadcrumb-item active" aria-current="page">Estados de Usuario</li>
        </ol>
      </nav>
    </div>

    <div class="admin-card fade-in">
      <div class="d-flex justify-content-end mb-3">
        <button id="btnAgregarEstadoUsuario" class="btn btn-primary-custom">Agregar Estado de Usuario</button>
      </div>

      <!-- Filtros y búsqueda -->
      <div class="row mb-3">
        <!-- Búsqueda por texto -->
        <div class="col-md-6">
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="text" class="form-control" id="buscarEstadoUsuario"
              placeholder="Buscar estado de usuario...">
          </div>
        </div>

        <!-- Filtro por estado -->
        <div class="col-md-6">
          <select class="form-select" id="filtroEstadoUsuario">
            <option value="">Todos los estados</option>
            <!-- aquí se llenan dinámicamente -->
          </select>
        </div>
      </div>


     <table class="table table-striped table-hover align-middle" aria-label="user status pivot table">
        <thead class="table-light">
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Descripción</th>
            <th>Creado</th>
            <th>Actualizado</th>
            <th colspan="2">Acciones</th>
          </tr>
        </thead>
        <tbody id="estadosUsuarioTableBody"></tbody>
      </table>


      <!-- Modal para agregar/editar estado de usuario -->
      <div class="modal fade" id="modalEditarEstadoUsuario" tabindex="-1" aria-labelledby="modalEditarEstadoUsuarioLabel" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <form id="formEditarEstadoUsuario">
              <div class="modal-header">
                <h5 class="modal-title" id="modalEditarEstadoUsuarioLabel">Editar Estado de Usuario</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
              </div>
              <div class="modal-body">
                <input type="hidden" id="editIdEstadoUsuario" name="editIdEstadoUsuario" />
                <div class="mb-3">
                  <label for="editNombre" class="form-label">Nombre</label>
                  <input type="text" class="form-control" id="editNombre" name="nombre" required />
                </div>
                <div class="mb-3">
                  <label for="editDescripcion" class="form-label">Descripción</label>
                  <textarea class="form-control" id="editDescripcion" name="descripcion" rows="3" required></textarea>
                </div>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn btn-primary-custom">Guardar Cambios</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script type="module" src="../public/assets/js/estadoUsuarioPanel.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <!-- Bootstrap JS Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Hide preload when loaded
      setTimeout(() => {
        document.getElementById('preloadId').style.opacity = '0';
        setTimeout(() => {
          document.getElementById('preloadId').style.display = 'none';
        }, 500);
      }, 1000);

      // Render sidebar
      renderSidebar('sidebar-container');
    });
  </script>
</body>
</html>
