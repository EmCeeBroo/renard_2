<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/jpeg" href="../public/assets/img/renard.png.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="../public/assets/css/usuarioPanel.css" />
  <title>Gestión de QrMenu - Administrador</title>
  <script src="../sidebar/sidebar.js" defer></script>
</head>

<body>

  <!-- Sidebar -->
  <div id="sidebar-container"></div>

  <!-- Main Content -->
  <div class="admin-content">
    <div class="admin-header">
      <h2><i class="bi bi-calendar-check"></i> Gestión de Qr Menu</h2>
    </div>

    <div class="admin-card fade-in">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h5 class="mb-0">Listado de Qr Menu</h5>
        <button class="btn btn-primary-custom" data-bs-toggle="modal" data-bs-target="#createQrMenuModal">
          <i class="fas fa-plus me-2"></i> Agregar Qr Menu
        </button>
      </div>

      <!-- Filtros y búsqueda -->
      <div class="row mb-3">
        <div class="col-md-6">
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="text" class="form-control" id="buscarInput" placeholder="Buscar por nombre">
          </div>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table table-bordered table-striped table-hover align-middle text-center" id="qrMenuTable" aria-label="QR menu pivot table">
          <thead class="table-dark">
            <tr>
              <th>Id</th>
              <th>Url</th>
              <th>Codigo</th>
              <th>Restaurante</th>
              <th>Menu</th>
              <th>Creado En</th>
              <th>Actualizado En</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="qrMenuTableBody">
            <!-- Contenido generado dinámicamente -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal Editar qr Menu -->
  <div class="modal fade" id="editQrMenuModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <form id="editQrMenuForm" class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Editar Qr Menu</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body row g-3">
          <!-- Campo oculto con el ID -->
          <input type="hidden" id="editQrMenuId">

          <div class="col-md-6">
            <label for="editUrl" class="form-label">Url</label>
            <input type="text" class="form-select" id="editUrl" required></input>
          </div>

          <div class="col-md-6">
            <label for="editCodigo" class="form-label">Codigo</label>
            <input type="text" class="form-select" id="editCodigo" required></input>
          </div>

          <div class="col-md-6">
            <label for="editRestaurante" class="form-label">Restaurante</label>
            <select class="form-select" id="editRestaurante" required></select>
          </div>

          <div class="col-md-6">
            <label for="editMenu" class="form-label">Menu</label>
            <select class="form-select" id="editMenu" required></select>
          </div>

        </div>

        <div class="modal-footer">
          <button type="submit" class="btn btn-success">Actualizar</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        </div>
      </form>
    </div>
  </div>


  <!-- Modal Crear qr Producto -->
  <div class="modal fade" id="createQrMenuModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <form id="createQrMenuForm" class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Crear Qr menu</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body row g-3">
          <div class="col-md-6">
            <label for="createUrl" class="form-label">Url</label>
            <input class="form-select" id="createUrl" required></input>
          </div>

          <div class="col-md-6">
            <label for="createCodigo" class="form-label">Codigo</label>
            <input class="form-select" id="createCodigo" required></input>
          </div>

          <div class="col-md-6">
            <label for="createRestaurante" class="form-label">Restaurante</label>
            <select class="form-select" id="createRestaurante" required></select>
          </div>

          <div class="col-md-6">
            <label for="createMenu" class="form-label">Menu</label>
            <select class="form-select" id="createMenu" required></select>
          </div>
        </div>

        <div class="modal-footer">
          <button type="submit" class="btn btn-primary">Guardar</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="module" src="../public/assets/js/qrMenuPanel.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderSidebar('sidebar-container');
    });
  </script>
</body>

</html>
