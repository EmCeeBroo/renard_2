<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/jpeg" href="../public/assets/img/renard.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../public/assets/css/usuarioPanel.css" />
  <title>Gestión de Usuarios - Administrador</title>
  <script src="../sidebar/sidebar.js" defer></script>
</head>

<body>
  <!--Preload-->
  <div class="preload" id="preloadId">
    <div class="preload-spinner"></div>
    <h3 class="mt-3">Cargando...</h3>
  </div>
  <!--End Preload-->

  <!-- Sidebar -->
  <div id="sidebar-container"></div>

  <!-- Main Content -->
  <div class="admin-content">
    <div class="admin-header">
      <h2><i class="bi bi-people"></i> Gestión de Usuarios</h2>
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="./admin/dashboard">Inicio</a></li>
          <li class="breadcrumb-item active" aria-current="page">Usuarios</li>
        </ol>
      </nav>
    </div>

    <div class="admin-card fade-in">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h5 class="mb-0">Listado de Usuarios</h5>
        <button class="btn btn-primary-custom" data-bs-toggle="modal" data-bs-target="#createUsuarioModal">
          <i class="fas fa-user-plus me-2"></i> Agregar usuario
        </button>
      </div>

      <!-- Filtros y búsqueda -->
      <div class="row mb-3">
        <div class="col-md-6">
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="text" class="form-control" id="buscarInput" placeholder="Buscar por correo...">
          </div>
        </div>
        <div class="col-md-3">
          <select class="form-select" id="filtroRol">
            <option value="">Todos los roles</option>
            <!-- Se llenará dinámicamente desde JS -->
          </select>
        </div>
        <div class="col-md-3">
          <select class="form-select" id="filtroEstado">
            <option value="">Todos los estados</option>
            <!-- Se llenará dinámicamente desde JS -->
          </select>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table table-bordered table-striped table-hover align-middle text-center" id="usuariosTable" aria-label="Dynamic Table of Users">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Correo</th>
              <th>Contraseña</th>
              <th>Estado</th>
              <th>Rol</th>
              <th>Creado En</th>
              <th>Actualizado En</th>
              <th>Acciones</th>
            </tr>
  </thead>
          <tbody id="usuariosTableBody">
            <!-- Contenido generado dinámicamente -->
          </tbody>
        </table>
        <!-- Paginación -->
        <nav aria-label="Paginación de usuarios" class="mt-3">
          <ul class="pagination justify-content-center" id="paginacion">
            <!-- Contenido generado dinámicamente por JavaScript -->
          </ul>
        </nav>
      </div>
    </div>
  </div>

  <!-- Modal para editar el usuario -->
  <div class="modal fade" id="modalEditarUsuario" tabindex="-1" aria-labelledby="modalEditarUsuarioLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="formEditarUsuario">
          <div class="modal-header">
            <h5 class="modal-title" id="modalEditarUsuarioLabel">Editar Usuario</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="editIdUsuario" />
            <div class="mb-3">
              <label for="editCorreo" class="form-label">Correo Electrónico</label>
              <input type="email" class="form-control" id="editCorreo" required />
            </div>
            <div class="mb-3">
              <label for="editContraseña" class="form-label">Contraseña</label>
              <input type="text" class="form-control" id="editContraseña" readonly />
              <small class="text-muted">La contraseña se muestra encriptada por seguridad.</small>
            </div>
            <div class="mb-3">
              <label for="editEstadoUsuario" class="form-label">Estado</label>
              <select class="form-select" id="editEstadoUsuario" required>
                <option value="">Seleccione un estado</option>
                <!-- Las opciones se cargarán dinámicamente -->
              </select>
            </div>
            <div class="mb-3">
              <label for="editRol" class="form-label">Rol</label>
              <select class="form-select" id="editRol" required>
                <option value="">Seleccione un rol</option>
                <!-- Las opciones se cargarán dinámicamente -->
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="button" class="btn btn-primary-custom" onclick="guardarCambiosUsuario()">
              <i class="fas fa-save me-2"></i> Guardar Cambios
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal para crear usuario -->
  <div class="modal fade" id="createUsuarioModal" tabindex="-1" aria-labelledby="createUsuarioModalLabel">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="createUsuarioForm">
          <div class="modal-header">
            <h5 class="modal-title" id="createUsuarioModalLabel">Crear Usuario</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label for="createCorreo" class="form-label">Correo Electrónico</label>
              <input type="email" class="form-control" id="createCorreo" required />
            </div>
            <div class="mb-3">
              <label for="createContraseña" class="form-label">Contraseña</label>
              <input type="password" class="form-control" id="createContraseña" required />
            </div>
            <div class="mb-3">
              <label for="createEstadoUsuario" class="form-label">Estado</label>
              <select class="form-select" id="createEstadoUsuario" required>
                <option value="">Seleccione un estado</option>
                <!-- Las opciones se cargarán dinámicamente -->
              </select>
            </div>
            <div class="mb-3">
              <label for="createRol" class="form-label">Rol</label>
              <select class="form-select" id="createRol" required>
                <option value="">Seleccione un rol</option>
                <!-- Las opciones se cargarán dinámicamente -->
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="button" class="btn btn-primary-custom" onclick="crearUsuario()">
              <i class="fas fa-plus-circle me-2"></i> Crear Usuario
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../public/assets/js/usuarioPanel.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderSidebar('sidebar-container');
    });
  </script>
</body>
</html>
