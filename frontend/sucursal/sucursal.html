<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/jpeg" href="../public/assets/img/renard.png.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../public/assets/css/usuarioPanel.css" />
  <title>Gestión de Sucursales - Administrador</title>
  <script src="../sidebar/sidebar.js" defer></script>
</head>

<body>
  <!-- Preload -->
  

  <!-- Sidebar -->
  <div id="sidebar-container"></div>

  <!-- Main Content -->
  <div class="admin-content">
    <div class="admin-header">
      <h2><i class="bi bi-calendar-check"></i> Gestión de Sucursales</h2>
    </div>

    <div class="admin-card fade-in">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h5 class="mb-0">Listado de Sucursales</h5>
        <button class="btn btn-primary-custom" data-bs-toggle="modal" data-bs-target="#createSucursalModal">
          <i class="fas fa-plus me-2"></i> Agregar sucursal
        </button>
      </div>

      <!-- Filtros y búsqueda -->
      <div class="row mb-3">
        <div class="col-md-6">
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="text" class="form-control" id="buscarSucursal" placeholder="Buscar por nombre o descripción...">
          </div>
        </div>
        <div class="col-md-3">
          <select class="form-select" id="filtroRestaurante">
            <option value="">Todos los restaurantes</option>
          </select>
        </div>
        <div class="col-md-3">
          <select class="form-select" id="itemsPorPagina">
            <option value="10">10 por página</option>
            <option value="25">25 por página</option>
            <option value="50">50 por página</option>
          </select>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table table-bordered table-striped table-hover align-middle text-center" id="SucursalTable" aria-label="branch pivot table">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Direccion</th>
              <th>Horario Apertura</th>
              <th>Horario Cierre</th>
              <th>Restaurante</th>
              <th>Creado En</th>
              <th>Actualizado En</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="sucursalTableBody">
            <!-- Contenido generado dinámicamente -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal Editar sucursal -->
  <div class="modal fade" id="editSucursalModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <form id="editSucursalForm" class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Editar sucursal</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body row g-3">
          <!-- Campo oculto con el ID -->
          <input type="hidden" id="editSucursalId">

          <div class="col-md-6">
            <label for="editNombre" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="editNombre" required>
          </div>

          <div class="col-md-6">
            <label for="editDireccion" class="form-label">Direccion</label>
            <input type="text" class="form-control" id="editDireccion" required>
          </div>

          <div class="col-md-6">
            <label for="editHoraApertura" class="form-label">Hora de apertura</label>
            <input type="time" class="form-control" id="editHoraApertura" required>
          </div>

          <div class="col-md-6">
            <label for="editHoraCierre" class="form-label">Hora de Cierre</label>
            <input type="time" class="form-control" id="editHoraCierre" required>
          </div>

          <div class="col-md-6">
            <label for="editRestaurante" class="form-label">Restaurante</label>
            <select class="form-select" id="editRestaurante" required></select>
          </div>
        </div>

        <div class="modal-footer">
          <button type="submit" class="btn btn-success">Actualizar</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        </div>
      </form>
    </div>
  </div>


  <!-- Modal Crear sucursal -->
  <div class="modal fade" id="createSucursalModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <form id="createSucursalForm" class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Crear sucursal</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body row g-3">
          <div class="col-md-6">
            <label for="createNombre" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="createNombre" required>
          </div>

          <div class="col-md-6">
            <label for="createDireccion" class="form-label">Direccion</label>
            <input type="text" class="form-control" id="createDireccion" required>
          </div>

          <div class="col-md-6">
            <label for="createHoraApertura" class="form-label">Hora Apertura</label>
            <input type="time" class="form-control" id="createHoraApertura" required>
          </div>

          <div class="col-md-6">
            <label for="createHoraCierre" class="form-label">Hora Cierre</label>
            <input type="time" class="form-control" id="createHoraCierre" required>
          </div>

          <div class="col-md-6">
            <label for="createRestaurante" class="form-label">Restaurante</label>
            <select class="form-select" id="createRestaurante" required></select>
          </div>
          
        </div>

        <div class="modal-footer">
          <button type="submit" class="btn btn-primary">Guardar</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../public/assets/js/SucursalPanel.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderSidebar('sidebar-container');
    });
  </script>
</body>
</html>
