<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/jpeg" href="../public/assets/img/renard.png.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <title>Panel de Categorías - Administrador</title>
  <link rel="stylesheet" href="../public/assets/css/style.css" />
  <script src="../sidebar/sidebar.js" defer></script>
</head>

<body>
  <div id="sidebar-container"></div>

  <div class="admin-content">
    <div class="admin-header">
      <h2><i class="bi bi-list-ul"></i> Panel de Categorías</h2>
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="../admin/dashboard">Inicio</a></li>
          <li class="breadcrumb-item active" aria-current="page">Categorías</li>
        </ol>
      </nav>
    </div>

    <div class="admin-card fade-in">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h5 class="mb-0">Listado de categorías</h5>
        <button class="btn btn-primary-custom" id="btnAgregar" type="button" data-bs-toggle="modal" data-bs-target="#createCategoriaModal">
          <i class="fas fa-plus me-2"></i> Crear Categoría
        </button>
      </div>

      <div class="row mb-3">
        <div class="col-md-6">
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="text" class="form-control" id="buscarInput" placeholder="Buscar por nombre" />
          </div>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table table-bordered table-striped table-hover align-middle text-center" id="tablaCategorias" aria-label="dynamic table of categories">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Creado</th>
              <th>Actualizado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="categoriaTableBody">
            <!-- Las filas se cargarán dinámicamente -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal Crear -->
  <div class="modal fade" id="createCategoriaModal" tabindex="-1" aria-labelledby="createCategoriaModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <form id="createCategoriaForm" class="modal-content needs-validation" novalidate>
        <div class="modal-header">
          <h5 class="modal-title" id="createCategoriaModalLabel">Crear Nueva Categoría</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="createNombre" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="createNombre" required />
            <div class="invalid-feedback">Por favor ingrese el nombre.</div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary-custom">Crear</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Editar -->
  <div class="modal fade" id="editCategoriaModal" tabindex="-1" aria-labelledby="editCategoriaModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <form id="editCategoriaForm" class="modal-content needs-validation" novalidate>
        <div class="modal-header">
          <h5 class="modal-title" id="editCategoriaModalLabel">Editar Categoría</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="editCategoriaId" />
          <div class="mb-3">
            <label for="editNombre" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="editNombre" required />
            <div class="invalid-feedback">Por favor ingrese el nombre.</div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary-custom">Guardar</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Ver -->
  <div class="modal fade" id="viewCategoriaModal" tabindex="-1" aria-labelledby="viewCategoriaModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="viewCategoriaModalLabel">Detalles de la Categoría</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <p><strong>ID:</strong> <span id="viewId"></span></p>
          <p><strong>Nombre:</strong> <span id="viewNombre"></span></p>
          <p><strong>Creado:</strong> <span id="viewCreatedAt"></span></p>
          <p><strong>Actualizado:</strong> <span id="viewUpdatedAt"></span></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="module" src="../public/assets/js/categoriaPanel.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderSidebar('sidebar-container');
    });
  </script>
</body>

</html>
