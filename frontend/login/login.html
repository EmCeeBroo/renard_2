<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../public/assets/img/renard.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" >
    <link rel="stylesheet" href="../public/assets/css/login.css">
    <title>Inicio de sesión</title>
</head>

<body>
    <div class="preload" id="preloadId">
        <div class="text-center">
            <h1 id="preload-title">Loading...</h1>
            <div class="spinner-grow text-primary position-absolute top-50 start-50" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
    </div>
    <!--End Preload-->

    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <img src="../public/assets/img/renard.png" class="img img-fluid" alt="Logo">
            </div>
            <div class="login-body">
                <h2 class="login-title">Bienvenido</h2>

                <!--Form-->
                <form id="login-form">
                    <input type="hidden" id="id" name="id">

                    <div class="form-floating mb-3">
                        <input type="email" class="form-control" id="correo" name="correo"
                            placeholder="name@example.com" required>
                        <label for="correo">Correo </label>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="password" class="form-control" id="contrasena" placeholder="Contraseña" required>
                        <label for="contrasena">Contraseña</label>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="userCheck">
                            <label class="form-check-label" for="userCheck">Recuerdame</label>
                        </div>
                        <a href="#" class="text-decoration-none" style="color: var(--primary);" data-bs-toggle="modal"
                            data-bs-target="#my-modal">¿Olvidaste tu
                            contraseña?</a>
                    </div>

                    <div class="social-login text-center mt-4">
                        <p>O inicia sesión con</p>
                        <a href="http://localhost:3000/auth/google" class="btn btn-light me-3">
                            <i class="bi bi-google"></i> Google
                        </a>
                        <a href="http://localhost:3000/auth/microsoft" class="btn btn-light ms-3">
                            <i class="bi bi-microsoft"></i> Microsoft
                        </a>
                    </div>


                    <div class="action-buttons">
                        <!-- Botón de registro solo redirige, sin modal -->
                        <button type="button" class="btn btn-outline-secondary"
                            onclick="window.location.href = '../registro/registro.html';"
                            title="¿Registrarse?">
                            <i class="bi bi-shield-fill-exclamation"></i> ¿Registrarse?
                        </button>

                        <!-- Botón de login funcional -->
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Login
                        </button>
                    </div>

                </form>
                <!--End Form-->
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="my-modal" tabindex="-1" aria-labelledby="my-modalLabel" aria-hidden="false">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="my-modalLabel">Restablecer Contraseña</h1>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <!--Form-->
                    <form id="my-form-changes-password">
                        <div class="form-floating mb-3">
                            <input type="email" class="form-control" id="email" name="email"
                                placeholder="name@example.com" required>
                            <label for="email">Correo electrónico</label>
                        </div>
                        <p class="text-muted">Ingresa tu correo electrónico y te enviaremos instrucciones para
                            restablecer tu contraseña.</p>
                    </form>
                    <!--End Form-->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button type="submit" form="my-form-changes-password" id="btnSubmit" class="btn btn-primary">
                        <i class="bi bi-send me-1"></i> Enviar enlace
                    </button>
                </div>
            </div>
        </div>
    </div>
    <!--End Modal-->


    <!--<script>
        document.addEventListener('DOMContentLoaded', () => {
            renderSidebar('sidebar-container');
        });
    </script>-->

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"></script>
    <!--JS data Tables-->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <!--SweetAlert2-->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    

    <script type="module" src="../public/assets/js/auth.js"></script>
    <script type="module" src="../public/assets/js/modalRecovery.js"></script>
    <script>
        // Hide preloader after page loads
        window.addEventListener('load', function () {
            document.getElementById('preloadId').style.display = 'none';
        });
    </script>
</body>

</html>
