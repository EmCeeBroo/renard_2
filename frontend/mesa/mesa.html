<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/jpeg" href="../public/assets/img/renard.png.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="../public/assets/css/usuarioPanel.css" />
  <title>Gestión de Mesas - Administrador</title>
  <script src="../sidebar/sidebar.js" defer></script>
</head>

<body>
  <!-- Sidebar -->
  <div id="sidebar-container"></div>

  <!-- Main Content -->
  <div class="admin-content">
    <div class="admin-header">
      <h2><i class="bi bi-calendar-check"></i> Gestión de Mesas</h2>
    </div>

    <div class="admin-card fade-in">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h5 class="mb-0">Listado de Mesas</h5>
        <button class="btn btn-primary-custom" data-bs-toggle="modal" data-bs-target="#createMesaModal">
          <i class="fas fa-plus me-2"></i> Agregar mesa
        </button>
      </div>

      <!-- Filtros y búsqueda -->
      <div class="row mb-3">
        <div class="col-md-6">
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="text" class="form-control" id="buscarMesa"
              placeholder="Buscar por zona, estado, sucursal o número de mesa...">
          </div>
        </div>
        <div class="col-md-3">
          <select class="form-select" id="itemsPorPagina">
            <option value="10">10 por página</option>
            <option value="25">25 por página</option>
            <option value="50">50 por página</option>
          </select>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table table-bordered table-striped table-hover align-middle text-center" id="mesaTable" aria-label="dynamic table of desks">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Zona</th>
              <th>Estado</th>
              <th>Sucursal</th>
              <th>Numero Mesa</th>
              <th>Creado En</th>
              <th>Actualizado En</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="mesaTableBody">
            <!-- Contenido generado dinámicamente -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal Editar Mesa -->
  <div class="modal fade" id="editMesaModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <form id="editMesaForm">
          <div class="modal-header">
            <h5 class="modal-title">Editar Mesa</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body row g-3">
            <!-- Campo oculto con el ID -->
            <input type="hidden" id="editMesaId">

            <div class="col-md-6">
              <label for="editZona" class="form-label">Zona</label>
              <select class="form-select" id="editZona" required></select>
            </div>

            <div class="col-md-6">
              <label for="editEstadoMesa" class="form-label">Estado Mesa</label>
              <select class="form-select" id="editEstadoMesa" required></select>
            </div>

            <div class="col-md-6">
              <label for="editSucursal" class="form-label">Sucursal</label>
              <select class="form-select" id="editSucursal" required></select>
            </div>

            <div class="col-md-6">
              <label for="editNumeroMesa" class="form-label">Número Mesa</label>
              <input type="number" class="form-control" id="editNumeroMesa">
            </div>
          </div>

          <div class="modal-footer">
            <button type="submit" class="btn btn-success">Actualizar</button>
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal Crear Mesa -->
  <div class="modal fade" id="createMesaModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <form id="createMesaForm">
          <div class="modal-header">
            <h5 class="modal-title">Crear Mesa</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body row g-3">
            <div class="col-md-6">
              <label for="createZona" class="form-label">Zona</label>
              <select class="form-select" id="createZona" required></select>
            </div>

            <div class="col-md-6">
              <label for="createEstadoMesa" class="form-label">Estado Mesa</label>
              <select class="form-select" id="createEstadoMesa" required></select>
            </div>

            <div class="col-md-6">
              <label for="createSucursal" class="form-label">Sucursal</label>
              <select class="form-select" id="createSucursal" required></select>
            </div>

            <div class="col-md-6">
              <label for="createNumeroMesa" class="form-label">Número Mesa</label>
              <input type="number" class="form-control" id="createNumeroMesa" required>
            </div>
          </div>

          <div class="modal-footer">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="module" src="../public/assets/js/mesa.js"></script>



  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderSidebar('sidebar-container');
    });
  </script>
</body>
</html>
