<!DOCTYPE html>
<html lang="es">

  <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/jpeg" href="../public/assets/img/renard.png.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../public/assets/css/style.css" />
  <title>Panel de Restaurante - Administrador</title>
</head>

<body>
  <!-- Sidebar -->
  <div id="sidebar-container"></div>

  <!-- Main Content -->
  <div class="admin-content">
    <div class="admin-header">
      <h2><i class="bi bi-shop"></i> Panel de Restaurante</h2>
    </div>

    <div class="admin-card fade-in">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h5 class="mb-0">Listado de Restaurantes</h5>
        <button class="btn btn-primary-custom" data-bs-toggle="modal" data-bs-target="#createRestauranteModal">
          <i class="fas fa-plus me-2"></i> Agregar restaurante
        </button>
      </div>


      <!-- Filtros y búsqueda -->
      <div class="row mb-3">
        <div class="col-md-6">
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="text" class="form-control" id="buscarInput" placeholder="Buscar por nombre">
          </div>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table table-bordered table-striped table-hover align-middle text-center" id="restauranteTable" aria-label="dynamic table of restaurants">
          <thead class="table-dark">
            <tr>
              <th>id</th>
              <th>Nombre</th>
              <th>Eslogan</th>
              <th>Url-Menu</th>
              <th>Imagen</th>
              <th>Creado En</th>
              <th>Actualizado En</th>
              <th>Descripcion</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="restauranteTableBody">
            <!-- Contenido generado dinámicamente -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal para editar el restaurante -->
  <div class="modal fade" id="editRestauranteModal" tabindex="-1" aria-labelledby="editRestauranteModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content align-items">
        <form id="editRestauranteForm">
          <div class="modal-header">
            <h5 class="modal-title" id="editRestauranteModalLabel">Editar restaurante</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body row-3">
            <input type="hidden" id="editRestauranteId" />
          <div class="col-md-6 mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" class="form-control" id="editNombreId" required />
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Eslogan</label>
            <input type="text" class="form-control" id="editEsloganId" required />
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Url-Menu</label>
            <input type="text" class="form-control" id="editUrlId" required />
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Imagen</label>
            <input type="file" class="form-control" id="editImagenId" accept="image/*" />
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Descripcion</label>
            <input type="text" class="form-control" id="editDescripcionId" />
          </div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-primary-custom">
              <i class="fas fa-save me-2"></i> Guardar
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal para crear restaurante -->
  <div class="modal fade" id="createRestauranteModal" tabindex="-1" aria-labelledby="createRestauranteModalLabel">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="createRestauranteForm">
          <div class="modal-header">
            <h5 class="modal-title" id="createRestauranteModalLabel">Crear Restaurante</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body">
          <div class="mb-3">
            <label for="createNombreId" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="createNombreId" required />
          </div>
          <div class="mb-3">
            <label for="createEsloganId" class="form-label">Eslogan</label>
            <input type="text" class="form-control" id="createEsloganId" required />
          </div>
          <div class="mb-3">
            <label for="createUrlId" class="form-label">Url-Menu</label>
            <input type="text" class="form-control" id="createUrlId" required />
          </div>
          <div class="mb-3">
            <label for="createImagenId" class="form-label">Imagen</label>
            <input type="file" class="form-control" id="createImagenId" accept="image/*" required />
          </div>
          <div class="mb-3">
            <label for="createDescripcionId" class="form-label">Descripcion</label>
            <input type="text" class="form-control" id="createDescripcionId" required />
          </div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-primary-custom">
              <i class="fas fa-plus-circle me-2"></i> Crear Restaurante
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal para ver detalles de restaurante -->
  <div class="modal fade" id="viewRestauranteModal" tabindex="-1" aria-labelledby="viewRestauranteModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="viewRestauranteModalLabel">Detalles de Restaurante</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <p><strong>Restaurante ID:</strong> <span id="viewRestauranteId"></span></p>
          <p><strong>Nombre:</strong> <span id="viewNombre"></span></p>
          <p><strong>Eslogan:</strong> <span id="viewEslogan"></span></p>
          <p><strong>Url:</strong> <span id="viewUrl"></span></p>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="../public/assets/js/RestaurantePanel.js"></script>
  <script src="../sidebar/sidebar.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderSidebar('sidebar-container');
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
