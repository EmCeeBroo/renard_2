<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/jpeg" href="../public/assets/img/renard.png.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <title>Panel de Rol - Administrador</title>
  <link rel="stylesheet" href="../public/assets/css/style.css">
  <link rel="stylesheet" href="../public/assets/css/rolPanel.css">
  <script src="../sidebar/sidebar.js" defer></script>
</head>

<body>
  <!--Preload-->
  <div class="preload" id="preloadId">
    <div class="preload-spinner"></div>
    <h3 class="mt-3">Cargando...</h3>
  </div>
  <!--End Preload-->

  <!-- Sidebar -->
  <div id="sidebar-container"></div>

  <!-- Main Content -->
  <div class="admin-content">
    <div class="admin-header">
      <h2><i class="bi bi-pin-map"></i> Gestión de Rol</h2>
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="/admin/dashboard">Inicio</a></li>
          <li class="breadcrumb-item active" aria-current="page">Rol</li>
        </ol>
      </nav>
    </div>

    <div class="admin-card fade-in">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h5 class="mb-0">Listado de Roles</h5>
        <button class="btn btn-primary-custom" id="btnAgregar">
          <i class="fas fa-plus me-2"></i> Agregar Rol
        </button>
      </div>

      <!-- Filtros y búsqueda -->
      <div class="row mb-3">
        <div class="col-md-6">
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="text" class="form-control" id="buscarRol" placeholder="Buscar por nombre o descripción...">
          </div>
        </div>
        <div class="col-md-3">
          <select class="form-select" id="filtroRestaurante">
            <option value="">Todos los restaurantes</option>
          </select>
        </div>
        <div class="col-md-3">
          <select class="form-select" id="itemsPorPagina">
            <option value="10">10 por página</option>
            <option value="25">25 por página</option>
            <option value="50">50 por página</option>
          </select>
        </div>
      </div>

      <!-- Tabla de roles -->
      <div class="table-responsive">
        <table class="table table-bordered table-striped table-hover align-middle" id="tablaRol" aria-label="dynamic role table">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Descripción</th>
              <th>Restaurante</th>
              <th>Creado</th>
              <th>Actualizado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <!-- Contenido generado dinámicamente -->
          </tbody>
        </table>
      </div>

      <!-- Paginación -->
      <nav aria-label="Paginación">
        <ul class="pagination justify-content-center" id="paginacion">
          <!-- Paginación generada dinámicamente -->
        </ul>
      </nav>
    </div>

    <!-- Modal único para agregar/editar Rol -->
    <div class="modal fade" id="modalRol" tabindex="-1" aria-labelledby="modalTitulo" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="formRol" class="needs-validation" novalidate>
            <div class="modal-header">
              <h5 class="modal-title" id="modalTitulo">Agregar Rol</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
              <input type="hidden" id="id_Rol" />
              
              <div class="mb-3">
                <label for="nombre" class="form-label">Nombre:</label>
                <input type="text" class="form-control" id="nombre" name="nombre" required maxlength="100" />
                <div class="invalid-feedback">Por favor ingrese un nombre válido.</div>
              </div>
              
              <div class="mb-3">
                <label for="descripcion" class="form-label">Descripción:</label>
                <textarea class="form-control" id="descripcion" name="descripcion" required maxlength="255" rows="3"></textarea>
                <div class="invalid-feedback">Por favor ingrese una descripción válida.</div>
              </div>
              
              <div class="mb-3">
                <label for="restaurante_fk" class="form-label">Restaurante:</label>
                <select class="form-select" id="restaurante_fk" name="restaurante_fk">
                  <option value="">Sin restaurante asignado</option>
                </select>
              </div>
            </div>
            <div class="modal-footer">
              <button type="submit" id="btnGuardar" class="btn btn-primary-custom">
                <i class="fas fa-save me-2"></i> Guardar
              </button>
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" id="btnCancelar">Cancelar</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="../public/assets/js/rolPanel.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderSidebar('sidebar-container');
    });
  </script>
  <script>
    // Ocultar preload
    setTimeout(function() {
      document.getElementById('preloadId').style.opacity = '0';
      document.getElementById('preloadId').style.visibility = 'hidden';
    }, 500);
  </script>
</body>
</html>
