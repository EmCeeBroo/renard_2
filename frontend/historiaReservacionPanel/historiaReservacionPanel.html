<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/jpeg" href="../pulic/assets/img/renard.png.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <title>Panel de Historial de Reservación - Administrador</title>
  <link rel="stylesheet" href="../public/assets/css/style.css" />
  <script src="../sidebar/sidebar.js" defer></script>
</head>
<body>
  <!--Preload-->
  <div class="preload" id="preloadId">
    <div class="preload-spinner"></div>
    <h3 class="mt-3">Cargando...</h3>
  </div>
  <!--End Preload-->

  <!-- Sidebar -->
  <div id="sidebar-container"></div>

  <!-- Main Content -->
  <div class="admin-content">
    <div class="admin-header">
      <h2><i class="bi bi-clock-history"></i> Gestión de Historial de Reservación</h2>
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="/admin/dashboard">Inicio</a></li>
          <li class="breadcrumb-item active" aria-current="page">Historial de Reservación</li>
        </ol>
      </nav>
    </div>

    <div class="admin-card fade-in">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h5 class="mb-0">Listado de Historial de Reservación</h5>
      </div>
      
      <!-- Filtros -->
      <div class="row mb-3">
        <div class="col-md-6">
          <input type="text" id="buscarHistorialReservacion" class="form-control" placeholder="Buscar en historial...">
        </div>
        <div class="col-md-4">
          <select id="filtroEstadoHistorial" class="form-select">
            <option value="">Todos los estados</option>
            <option value="Pendiente">Pendiente</option>
            <option value="Confirmada">Confirmada</option>
            <option value="Cancelada">Cancelada</option>
            <option value="Completada">Completada</option>
          </select>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table table-bordered table-striped table-hover align-middle text-center" id="tablaHistorialReservacion" aria-label="dynamic table of reservation history">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Fecha Cambio Estado</th>
              <th>Restaurante</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody id="tablaHistorialReservacionBody">
            <!-- Contenido generado dinámicamente -->
          </tbody>
        </table>
      </div>
      <!-- Paginacion-->
      <div id="paginacionHistorial" class="mt-3"></div>
    </div>

    <!-- Modal para agregar/editar historial de reservación -->
    <div class="modal fade" id="modalHistorialReservacion" tabindex="-1" aria-labelledby="modalTitulo" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="formHistorialReservacion" class="needs-validation" novalidate>
            <div class="modal-header">
              <h5 class="modal-title" id="modalTitulo">Agregar Historial de Reservación</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
              <input type="hidden" id="id_historial_reservacion" />
              <div class="mb-3">
                <label for="fecha_cambio_estado" class="form-label">Fecha Cambio Estado:</label>
                <input type="datetime-local" class="form-control" id="fecha_cambio_estado" name="fecha_cambio_estado" required />
                <div class="invalid-feedback">Por favor ingrese la fecha de cambio de estado.</div>
              </div>
              <div class="mb-3">
                <label for="reservacion_fk" class="form-label">Reservacion FK:</label>
                <input type="number" class="form-control" id="reservacion_fk" name="reservacion_fk" required />
                <div class="invalid-feedback">Por favor ingrese el ID de la reservación.</div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="submit" id="btnGuardar" class="btn btn-success">Guardar</button>
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" id="btnCancelar">Cancelar</button>
            </div>
          </form>
        </div>
      </div>
    </div>

  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script type="module" src="../public/assets/js/historiaReservacionPanel.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderSidebar('sidebar-container');
    });
  </script>
  <script>
    // Ocultar preload
    setTimeout(function () {
      document.getElementById('preloadId').style.opacity = '0';
      document.getElementById('preloadId').style.visibility = 'hidden';
    }, 500);
  </script>
</body>
</html>
